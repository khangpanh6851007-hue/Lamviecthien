name: Deploy Static Content to GitHub Pages

on:
  # Chạy workflow mỗi khi có push lên nhánh main (hoặc master)
  push:
    branches: ["main"]

  # Cho phép kích hoạt thủ công từ tab Actions trên GitHub
  workflow_dispatch:

# Phân quyền cần thiết cho GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Đảm bảo chỉ có một tiến trình deploy chạy tại một thời điểm
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact (toàn bộ thư mục gốc)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
